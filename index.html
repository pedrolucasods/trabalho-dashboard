<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="style.css">
    <link href="https://fonts.googleapis.com/icon?family=Material+Icons" rel="stylesheet" />
    <link href="https://fonts.googleapis.com/icon?family=Material+Symbols" rel="stylesheet" />
    <title>Document</title>
</head>
<body>
    <div class="container">
        <div class="sidebar">
            <div class="sidebar-logo">
                <div class="logo">logo</div>
                 <span class="material-icons icons" id="icon-arrow">keyboard_arrow_left</span>
            </div>

            <div class="sidebar-options">
                <div class="option">
                    <span class="material-symbols icons" id="icon-arrow">home</span>
                    <h2>Dashboard</h2>
                </div>
                <div class="option">
                    <span class="material-symbols icons" id="icon-arrow">folder</span>
                    <h2>Projetos</h2>
                </div>
                <div class="option">
                    <span class="material-symbols icons" id="icon-arrow">task</span>
                    <h2>Tarefas</h2>
                </div>
                <div class="option">
                    <span class="material-symbols icons" id="icon-arrow">group</span>
                    <h2>Equipe</h2>
                </div>
                <div class="option">
                    <span class="material-symbols icons" id="icon-arrow">calendar_check</span>
                    <h2>Calendário</h2>
                </div>
                <div class="option">
                    <span class="material-symbols icons" id="icon-arrow">finance</span>
                    <h2>Relatórios</h2>
                </div>
                <div class="option">
                    <span class="material-icons icons" id="icon-arrow">chat_bubble_outline</span>
                    <h2>Mensagens</h2>
                </div>
                <div class="option">
                    <span class="material-symbols icons" id="icon-arrow">settings</span>
                    <h2>Configurações</h2>
                </div>
            </div>
            <div class="footer-side">
                <div class="option exit">
                    <span class="material-symbols icons" id="icon-arrow">exit_to_app</span>
                    <h2>Sair</h2>
                </div>
            </div>
            
        </div>
        <div class="content">
            <div class="menu">
                <div class="item-1">
                    <span class="material-symbols icons" id="icon-arrow">density_medium</span>
                    <h1>Dashboard</h1>
                </div>
                <div class="item-2">
                    <div class="search-container">
                        <input placeholder="Buscar...">
                        <span class="material-symbols icons">search</span>
                    </div>
                    
                    <button class="material-symbols theme">partly_cloudy_night</button>
                    <img src="./assets/logouser.png" alt="user" width="50px" height="50px" id="user-foto">
                    <h2>Usuário</h2>
                    <span class="material-symbols icons" id="icon-arrow">keyboard_arrow_down</span>
                    
                </div>
            </div>
            <div class="content-data"></div>
        </div>
    </div>
</body>
<script src="script.js"></script>
</html>
